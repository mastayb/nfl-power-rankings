[project]
name = "nfl-market-ratings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "httpx",
    "pyyaml",
    "nflreadpy",
    "cma",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
