  market: closing lines through week k+1; résumé: results through week k; luck-neutral résumé: results
  minus fumble + INT luck points; margins capped +-21, 3-week half-life. Intervals: 90% season bootstrap.
  Weeks outside 2-12 use the nearest end.'
